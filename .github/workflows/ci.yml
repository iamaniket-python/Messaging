name: CI

on:
  push:
    branches: [backend, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat_password
          POSTGRES_DB: chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://chat:chat_password@localhost:5432/chat_test
      TEST_DATABASE_URL: postgresql://chat:chat_password@localhost:5432/chat_test
      TEST_REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Migrate
        run: npm run migrate

      - name: Tests
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t chat-backend:ci .